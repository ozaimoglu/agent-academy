id = "local.agent-academy"
name = "Agent Academy"
version = "0.1.0"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]
description = "Codex çalışmalarını yerel, kanıta dayalı mühendislik derslerine dönüştürür."

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

[[panes]]
id = "academy"
title = "Agent Academy"
placement = "split"
command = ["scripts/academy.sh", "--pane"]

[[actions]]
id = "open"
title = "Academy: aç"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--action", "open"]

[[actions]]
id = "close"
title = "Academy: kapat"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--action", "close"]

[[actions]]
id = "toggle"
title = "Academy: aç / kapat"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--action", "toggle"]
