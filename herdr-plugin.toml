id = "local.agent-academy"
name = "Agent Academy"
version = "0.1.0"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]
description = "Turns Codex work into local, evidence-backed engineering lessons."

[[build]]
command = ["bash", "scripts/install.sh", "--build-only"]

[[panes]]
id = "academy"
title = "Agent Academy"
placement = "split"
command = ["scripts/academy.sh", "--pane"]

[[actions]]
id = "open"
title = "Academy: open panel (standby)"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--action", "open"]

[[actions]]
id = "close"
title = "Academy: close panel"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--action", "close"]

[[actions]]
id = "toggle"
title = "Academy: toggle panel"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--action", "toggle"]

[[actions]]
id = "doctor"
title = "Academy: diagnose installation"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--doctor"]

[[actions]]
id = "verify"
title = "Academy: verify installation"
contexts = ["pane", "workspace"]
command = ["scripts/academy.sh", "--verify-install"]
